# docker-compose.dev.yml — clarity-website
# Public marketing website with blog, products, services, and pricing

services:

  db:
    image: postgres:13
    container_name: dev-website-postgres
    environment:
      POSTGRES_DB: dev_website
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5439:5432"
    volumes:
      - dev_website_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_website"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-website-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8007:8000"
    environment:
      DJANGO_SETTINGS_MODULE: clarity_website.settings_dev_docker
      DEBUG: "True"
      SECRET_KEY: dev-secret-key-website-12345
      DB_NAME: dev_website
      DB_USER: dev_user
      DB_PASSWORD: dev_password
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  dev_website_postgres_data:
