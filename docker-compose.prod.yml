# docker-compose.prod.yml — Avail Technologies (Clarity Website)
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: clarity_production_db
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME:-clarity_website}
      POSTGRES_USER: ${DB_USER:-website_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securewebsitepassword}
    volumes:
      - clarity_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-website_user} -d ${DB_NAME:-clarity_website}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  web:
    image: ${DOCKER_REGISTRY:-tinashemp}/clarity-website:${TAG:-latest}
    container_name: clarity_production_app
    restart: always
    ports:
      - "${HOST_PORT:-8007}:8000"
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=clarity_website.settings_prod
      - PYTHONUNBUFFERED=1
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-0}
      - AUTO_SEED=${AUTO_SEED:-True}
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - clarity_prod_media:/app/media
      - clarity_prod_staticfiles:/app/staticfiles
      - clarity_prod_data:/app/data
      - clarity_prod_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

volumes:
  clarity_prod_pgdata:
  clarity_prod_media:
  clarity_prod_staticfiles:
  clarity_prod_data:
  clarity_prod_logs:
